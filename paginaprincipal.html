<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pan y Miel — Panadería artesanal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #FBF6EE;
            color: #3D2B1F;
            line-height: 1.6;
        }

        h1, h2, h3, .logo {
            font-family: 'Fraunces', serif;
        }

        /* Encabezado */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 48px;
            border-bottom: 1px solid #E8DDC8;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: #6B4226;
        }

        .nav a {
            margin-left: 28px;
            text-decoration: none;
            color: #3D2B1F;
            font-size: 15px;
        }

        .nav a:hover {
            color: #C98A2C;
        }

        /* Sección de inicio */
        .hero {
            padding: 80px 48px;
            max-width: 640px;
        }

        .hero h1 {
            font-size: 40px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #6B4226;
        }

        .hero p {
            font-size: 17px;
            color: #5A4636;
        }

        /* Catálogo */
        .catalogo {
            padding: 0 48px 80px;
        }

        .catalogo h2 {
            font-size: 28px;
            margin-bottom: 32px;
            color: #6B4226;
        }

        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
        }

        .tarjeta-producto {
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border: 1px solid #E8DDC8;
            border-radius: 10px;
            padding: 24px;
        }

        .tarjeta-producto h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #3D2B1F;
        }

        .tarjeta-producto p {
            font-size: 14px;
            color: #7A6A57;
            margin-bottom: 16px;
        }

        .precio {
            font-weight: 500;
            color: #C98A2C;
            font-size: 16px;
        }

        .foto-producto {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 16px;
            background: #E8DDC8;
        }

        /* Contacto */
        .contacto {
            padding: 0 48px 80px;
        }

        .contacto h2 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #6B4226;
        }

        .contacto ul {
            list-style: none;
            color: #5A4636;
        }

        .contacto li {
            margin-bottom: 8px;
        }

        /* Botones (Sprint 3) */
        .boton {
            display: inline-block;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 500;
            background: #6B4226;
            color: #ffffff;
            border: 0;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
        }

        .boton:hover {
            background: #C98A2C;
        }

        .boton-agregar {
            display: block;
            width: 100%;
            margin-top: auto;
        }

        .tarjeta-producto .precio {
            margin-bottom: 14px;
        }

        .boton-secundario {
            background: transparent;
            color: #6B4226;
            border: 1px solid #6B4226;
        }

        .boton-secundario:hover {
            background: #E8DDC8;
        }

        .nav-carrito {
            font-weight: 500;
            color: #6B4226;
        }

        /* Carrito (PB-06) */
        .carrito, .pedido {
            padding: 0 48px 80px;
            max-width: 760px;
        }

        .carrito h2, .pedido h2 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #6B4226;
        }

        .vacio {
            color: #7A6A57;
        }

        .lista-carrito {
            list-style: none;
            border-top: 1px solid #E8DDC8;
        }

        .lista-carrito li {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid #E8DDC8;
        }

        .cantidad {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .boton-mini {
            width: 28px;
            height: 28px;
            border: 1px solid #CDBBA0;
            background: #ffffff;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            color: #3D2B1F;
        }

        .boton-mini:hover {
            background: #E8DDC8;
        }

        .subtotal {
            min-width: 80px;
            text-align: right;
            color: #C98A2C;
            font-weight: 500;
        }

        .enlace-quitar {
            background: none;
            border: 0;
            color: #7A6A57;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }

        .total {
            margin: 16px 0;
            font-size: 18px;
        }

        /* Formulario de pedido (PB-07) */
        .pedido form {
            display: grid;
            gap: 6px;
        }

        .pedido label {
            font-weight: 500;
            margin-top: 10px;
        }

        .pedido input[type="text"],
        .pedido input[type="tel"],
        .pedido textarea {
            padding: 10px;
            border: 1px solid #CDBBA0;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            background: #ffffff;
        }

        .pedido fieldset {
            border: 1px solid #E8DDC8;
            border-radius: 8px;
            padding: 8px 14px 14px;
            margin-top: 12px;
        }

        .pedido .opcion {
            display: flex;
            gap: 10px;
            align-items: center;
            font-weight: 400;
        }

        .error {
            color: #A5341F;
            font-size: 14px;
        }

        .resumen {
            margin-top: 12px;
            color: #5A4636;
        }

        .pedido .boton {
            justify-self: start;
            margin-top: 12px;
        }

        .confirmacion {
            background: #ffffff;
            border: 1px solid #E8DDC8;
            border-radius: 10px;
            padding: 24px;
        }

        .confirmacion ul {
            margin: 12px 0 12px 20px;
        }

        /* Pie de página */
        .footer {
            padding: 24px 48px;
            border-top: 1px solid #E8DDC8;
            text-align: center;
            font-size: 13px;
            color: #7A6A57;
        }
    </style>
</head>
<body>

    <!-- Aquí React va a "montar" toda la aplicación -->
    <div id="root"></div>

    <!-- React y ReactDOM, cargados directo desde CDN (sin necesidad de instalar Node/npm) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel permite escribir JSX (la sintaxis de React) directamente en el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <!-- Nuestro código de la aplicación, escrito en JSX -->
    <script type="text/babel" src="app.js"></script>

</body>
</html>
